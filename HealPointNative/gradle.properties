# HealPoint - Gradle configuration
# =================================

# JVM settings for the Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin code style
kotlin.code.style=official

# API base URL
# -------------
# Set an explicit backend URL for a given build by passing:
#     gradlew assembleDebug -PHEALPOINT_API_URL=https://api.example.com/api/v1
# The build script applies its own sane per-build-type default when this is
# left empty (debug -> Android emulator loopback, release -> REQUIRED).
# HEALPOINT_API_URL=
